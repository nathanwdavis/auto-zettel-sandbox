# zettel-bootstrap content-repo configuration (FR-2).
# Genesis writes every key below; maintenance runs read them and hard-fail
# with a clear message if a required key is missing (AC-2).

# Changed 2026-09-03 by human decision, answering the INBOX entry
# "config.yml topics no longer describe this base". Theology and philosophy
# lead because they are what this repository is actually for; `zettelkasten
# method` and `compound growth` are KEPT rather than dropped, because 19
# permanent notes and several queued INBOX/inquiry items still sit under them
# and topics are what the cadence gap-fills against. Runs may not edit this
# list; only a human may.
topics: ["theology", "philosophy", "zettelkasten method", "compound growth"]

# Cron-like string or a human phrase ("weekly on Sunday at 06:00").
cadence: "on-demand (spike)"

budget:
  usd: 5          # per-run cap, passed to claude -p --max-budget-usd
  max_turns: 40  # passed to --max-turns; print mode has no default

# suggest | auto-commit | autonomous
autonomy_level: suggest

content_repo:
  name: "auto-zettel-sandbox"
  owner: "nathanwdavis"
  visibility: "public"   # public | private

embedding:
  enabled: false
  model: "sentence-transformers/all-MiniLM-L6-v2"

models:
  strong: "claude-opus-5"
  cheap: "claude-sonnet-5"

# Slower sub-cadences (FR-28 steps 5 and 7).
connector_cadence: "daily"
skill_smith_cadence: "weekly"
